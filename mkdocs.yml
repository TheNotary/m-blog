site_name: M Blog
site_url: https://example.com  # TODO: replace with actual URL
site_description: Micro-thoughts and longer articles.

theme:
  name: material
  features:
    - navigation.indexes

plugins:
  - search
  - blog:
      blog_dir: blog
      post_url_format: "{date}/{slug}"
      post_excerpt: optional
      archive: true
      categories: false
      authors: false
  - rss:
      match_path: "blog/posts/.*"
      date_from_meta:
        as_creation: date
        datetime_format: "%Y-%m-%d"
      use_git: false
      use_material_blog: true
      feeds_filenames:
        rss_created: feed.xml
      pretty_print: true
      feed_ttl: 1440

hooks:
  - hooks/unlisted.py

nav:
  - Blog:
      - blog/index.md
